name: Supabase Guard
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  rls-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
        with: { fetch-depth: 1 }
      - name: Verify migrations enforce RLS
        shell: bash
        run: |
          set -euo pipefail
          bad=0
          for f in supabase/migrations/*.sql; do
            [ -e "$f" ] || continue
            if grep -Eiq 'CREATE[[:space:]]+TABLE' "$f"; then
              while IFS= read -r table; do
                [ -z "$table" ] && continue
                if ! grep -Eiq "ALTER[[:space:]]+TABLE[[:space:]]+(IF[[:space:]]+EXISTS[[:space:]]+)?${table}[[:space:]]+ENABLE[[:space:]]+ROW[[:space:]]+LEVEL[[:space:]]+SECURITY" "$f"; then
                  echo "::error file=$f::CREATE TABLE $table has no same-migration ENABLE ROW LEVEL SECURITY"
                  bad=1
                fi
              done < <(sed -nE 's/.*CREATE[[:space:]]+TABLE[[:space:]]+(IF[[:space:]]+NOT[[:space:]]+EXISTS[[:space:]]+)?("?[_a-zA-Z][_a-zA-Z0-9]*"?).*/\2/p' "$f" | tr -d '"')
            fi
          done
          exit "$bad"
      - name: Block unsafe public policies
        shell: bash
        run: |
          set -euo pipefail
          if grep -RniE 'CREATE[[:space:]]+POLICY.*TO[[:space:]]+authenticated.*USING[[:space:]]*\(true\)|GRANT[[:space:]]+ALL[[:space:]]+ON[[:space:]]+.*TO[[:space:]]+anon' supabase/migrations; then
            echo "::error::Over-permissive policy detected"
            exit 1
          fi
