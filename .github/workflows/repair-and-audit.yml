name: Repair and audit Deskcomm

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair-audit:
    if: !contains(github.event.head_commit.message, 'repair:')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Repair source deterministically
        shell: python
        run: |
          from pathlib import Path
          import re

          desk = Path('app/deskcomm.tsx')
          text = desk.read_text(encoding='utf-8')

          # The current A&K adapter references this component but the previous
          # prototype accidentally omitted its definition. Keep the existing
          # UI intact and add the missing real screen instead of rewriting the CRM.
          if 'function AIProviders(' not in text:
              marker = 'function Settings('
              pos = text.find(marker)
              if pos == -1:
                  raise SystemExit('Não encontrei o ponto seguro para inserir AIProviders')
              component = r'''
function AIProviders(){
 const providers=[
  {name:'Vercel AI Gateway',detail:'Roteamento unificado de modelos e observabilidade',cost:'Configuração externa'},
  {name:'OpenAI',detail:'Modelos OpenAI via variável de ambiente',cost:'API paga conforme uso'},
  {name:'Anthropic',detail:'Modelos Claude via variável de ambiente',cost:'API paga conforme uso'},
  {name:'Google Gemini',detail:'Modelos Gemini via variável de ambiente',cost:'Pode ter cota gratuita, conforme a conta e os limites vigentes'}
 ];
 return <><Head title="Provedores de IA" sub="Conectores de modelos usados pelos agentes"/><div className="card"><div className="notice">Nenhuma chave de API é exibida nesta tela. O CRM usa variáveis de ambiente no servidor e nunca grava segredo no navegador.</div>{providers.map(p=><div className="row" key={p.name}><div><b>{p.name}</b><small>{p.detail}</small></div><span className="pill">{p.cost}</span></div>)}</div></>
}

'''
              text = text[:pos] + component + text[pos:]

          text = text.replace('Customer 360', 'Visão 360 do cliente')
          desk.write_text(text, encoding='utf-8')

          css = Path('app/globals.css')
          c = css.read_text(encoding='utf-8')
          c = c.replace('aside{width:245px;', 'aside{width:245px;overflow-y:auto;overflow-x:hidden;')
          c = c.replace('.nav{width:100%;', '.nav{width:100%;flex:0 0 auto;')
          c = c.replace('.asideBottom{margin-top:auto}', '.asideBottom{margin-top:12px;flex:0 0 auto}')
          c = c.replace('section{padding:28px;', 'section{padding:28px;min-width:0;')
          c = c.replace('table{width:100%;border-collapse:collapse}', 'table{width:100%;min-width:760px;border-collapse:collapse}')
          c += '\n/* Desktop/mobile stability: the complete navigation remains reachable without changing the original layout. */\naside::-webkit-scrollbar{width:6px}aside::-webkit-scrollbar-thumb{background:#2b3c58;border-radius:99px}.tablewrap{-webkit-overflow-scrolling:touch}\n'
          css.write_text(c, encoding='utf-8')

          imp = Path('app/api/import/route.ts')
          s = imp.read_text(encoding='utf-8')
          start = s.find('   const rawRows=')
          end_marker = '   await supabase.from("import_jobs").insert({organization_id:orgId,file_name:file.name,row_count:imported,status:"completed",created_by:userId});'
          end = s.find(end_marker)
          if start == -1 or end == -1 or end <= start:
              raise SystemExit('Não encontrei o bloco de importação para corrigir')

          replacement = r'''   const rawRows:Record<string,unknown>[]=[];
   for(const sheetName of wb.SheetNames){
     const sheet=wb.Sheets[sheetName];
     if(!sheet)continue;
     const remaining=MAX_ROWS_PER_FILE-rawRows.length;
     if(remaining<=0)break;
     const sheetRows=XLSX.utils.sheet_to_json<Record<string,unknown>>(sheet,{defval:"",raw:false}).slice(0,remaining);
     rawRows.push(...sheetRows);
   }
   read=rawRows.length;
   if(!read)throw new Error("Nenhuma linha encontrada");
   const rows=rawRows.map(raw=>{
     const r:Record<string,string>={};
     for(const[k,v]of Object.entries(raw))r[key(k)]=norm(v);
     return r;
   }).map(r=>({
     name:r.nome||r.name||r.cliente||r.contato,
     phone:r.telefone||r.phone||r.celular||r.whatsapp,
     product:r.produto||r.product||"Não informado",
     cpf:r.cpf||null,
     email:r.email||null,
     notes:r.observacoes||r.observacoes_cliente||r.notes||null
   })).filter(r=>r.name&&r.phone&&r.phone.length<=32);
   skipped=read-rows.length;
   const phones=[...new Set(rows.map(r=>r.phone))];
   const blockedSet=new Set<string>();
   for(let i=0;i<phones.length;i+=500){
     const {data}=await supabase.from("blocked_numbers").select("phone").eq("organization_id",orgId).in("phone",phones.slice(i,i+500));
     (data||[]).forEach(x=>blockedSet.add(x.phone));
   }
   const allowedRows=rows.filter(r=>!blockedSet.has(r.phone));
   skipped+=rows.length-allowedRows.length;
   for(let i=0;i<allowedRows.length;i+=500){
     const chunk=allowedRows.slice(i,i+500);
     const contactsByPhone=new Map<string,typeof chunk[number]>();
     for(const row of chunk)contactsByPhone.set(row.phone,row);
     const c=await supabase.from("contacts").upsert([...contactsByPhone.values()].map(r=>({organization_id:orgId,name:r.name,phone:r.phone,cpf:r.cpf,email:r.email,notes:r.notes,source:"importacao"})),{onConflict:"organization_id,phone"}).select("id,phone");
     if(c.error)throw new Error("Falha ao salvar clientes");
     const ids=new Map((c.data||[]).map(x=>[x.phone,x.id]));
     const inserts=chunk.map(r=>({organization_id:orgId,contact_id:ids.get(r.phone)!,product:r.product}));
     if(inserts.length){
       const l=await supabase.from("leads").insert(inserts);
       if(l.error)throw new Error("Falha ao salvar leads");
       imported+=inserts.length;
     }
   }
'''
          s = s[:start] + replacement + s[end:]
          imp.write_text(s, encoding='utf-8')

          crm = Path('app/api/crm/route.ts')
          r = crm.read_text(encoding='utf-8')
          r = r.replace('.order("created_at",{ascending:false}).limit(100),', '.order("created_at",{ascending:false}).limit(5000),', 1)
          r = r.replace('contact:contacts(id,name,phone,blocked,npd)', 'contact:contacts(id,name,phone,blocked,blocked_reason,npd)', 1)
          crm.write_text(r, encoding='utf-8')

          print('Correções de fonte aplicadas.')

      - name: Install dependencies
        run: npm install

      - name: TypeScript audit
        run: npm run typecheck

      - name: ESLint audit
        run: npm run lint

      - name: Production build audit
        run: npm run build

      - name: Commit only after every audit passes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/repair-and-audit.yml
          if git diff --quiet; then
            echo "Nenhuma alteração necessária."
            exit 0
          fi
          git add app/deskcomm.tsx app/globals.css app/api/import/route.ts app/api/crm/route.ts .github/workflows/repair-and-audit.yml
          git commit -m "repair: stabilize CRM, imports and AI providers"
          git push origin main
