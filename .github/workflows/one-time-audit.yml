name: One-time CRM audit
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  audit:
    if: ${{ !contains(github.event.head_commit.message, 'audit:') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch dashboard lead limit
        run: python3 -c 'from pathlib import Path; p=Path("app/api/crm/route.ts"); s=p.read_text(); s=s.replace(".order(\"created_at\",{ascending:false}).limit(100),", ".order(\"created_at\",{ascending:false}).limit(5000),", 1); s=s.replace("contact:contacts(id,name,phone,blocked,npd)", "contact:contacts(id,name,phone,blocked,blocked_reason,npd)", 1); p.write_text(s)'
      - name: Install
        run: npm install
      - name: TypeScript
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Production build
        run: npm run build
      - name: Commit validated result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/one-time-audit.yml
          git add app/api/crm/route.ts .github/workflows/one-time-audit.yml
          git commit -m "audit: validated CRM fixes"
          git push origin main
