name: Security Scan
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
  security-events: write
jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with: { fetch-depth: 0 }
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
      - name: Explicit secret patterns
        shell: bash
        run: |
          set -euo pipefail
          if git grep -nE 'sb_(anon|service_role)_[A-Za-z0-9_-]+|VERCEL_TOKEN[[:space:]]*[:=]|OPENAI_API_KEY[[:space:]]*[:=]|STRIPE_SECRET[[:space:]]*[:=]|NEXT_PUBLIC_(SERVICE_ROLE|SECRET)[[:space:]]*[:=]' -- ':!package-lock.json' ':!pnpm-lock.yaml'; then
            echo "Potential credential exposure detected."
            exit 1
          fi
      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with: { node-version: 22, cache: npm }
      - name: Install
        run: npm install --ignore-scripts
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Dependency audit
        run: npm audit --audit-level=high
      - name: Build
        run: npm run build
